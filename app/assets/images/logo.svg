<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund Kreis -->
  <circle cx="50" cy="50" r="50" fill="#CC0000"/>

  <!-- Innerer Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

  <!-- Checkmark Symbol -->
  <path d="M 30 48 L 42 60 L 70 32"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Rails Icon Elemente (stilisierte Schienen) -->
  <g opacity="0.4">
    <rect x="20" y="68" width="60" height="3" fill="#FFFFFF" rx="1.5"/>
    <rect x="20" y="75" width="60" height="3" fill="#FFFFFF" rx="1.5"/>
  </g>

  <!-- Kleine Akzent-Punkte -->
  <circle cx="25" cy="25" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="75" cy="25" r="3" fill="#FFFFFF" opacity="0.6"/>
